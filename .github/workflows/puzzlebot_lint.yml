name: Lint Puzzlebot Simulator

on:
  push:
    paths:
      - 'puzzlebot_sim/puzzlebot_sim/puzzlebot_simulator.py'
  pull_request:
    paths:
      - 'puzzlebot_sim/puzzlebot_sim/puzzlebot_simulator.py'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint puzzlebot_simulator.py
        run: ruff check puzzlebot_sim/puzzlebot_sim/puzzlebot_simulator.py
